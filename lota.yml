dev:
  desc: "Run in development mode"
  vars:
  - "APP_DIR=./"
  script: $HOME/.go/bin/wails dev -tags webkit2_41

build:
  desc: "Build the application"

  nsis:
    desc: "Build for Windows (amd64)"
    script: |
      $HOME/.go/bin/wails build -tags webkit2_41 -ldflags "-s -w" -trimpath -platform windows/amd64 -nsis -installscope user -o safe-wheel-windows-amd64.exe
      rm -rfv ./build/bin/safe-wheel-windows-amd64.exe
  windows:
    desc: "Build for Windows (amd64)"
    script: $HOME/.go/bin/wails build -tags webkit2_41 -ldflags "-s -w" -trimpath -platform windows/amd64 -o safe-wheel-windows-amd64.exe

  linux:
    desc: "Build for Linux (amd64)"
    script: $HOME/.go/bin/wails build -tags webkit2_41 -ldflags "-s -w" -trimpath -platform linux/amd64 -o safe-wheel-linux-amd64

  all:
    desc: "Build for all OS (Windows, Linux)"
    script: echo "Start building for all OS"
    depends:
    - build.windows
    - build.linux
    parallel: true

push:
  desc: Push to GitHub
  color: cyan
  args:
  - "tag:str?"
  script: |
    if [ -n $tag ]; then
      version=$(echo $tag | sed 's/^v//')
      sed -i "s/\"productVersion\": \"[^\"]*\"/\"productVersion\": \"$version\"/" wails.json
      git add wails.json
      git commit -m "chore: bump version to $version"
      git tag -f $tag
      git push origin $tag --force
      git push
    else
      git push origin main
    fi
