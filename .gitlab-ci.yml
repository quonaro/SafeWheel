stages:
  - build
  - release

variables:
  NODE_VERSION: "18"

# Кэширование node_modules
cache:
  paths:
    - node_modules/
    - frontend/node_modules/

# Сборка для Linux
build:linux:
  stage: build
  image: node:18
  before_script:
    - apt-get update && apt-get install -y zip
  script:
    - npm install
    - cd frontend && npm install && cd ..
    - npm run build:frontend
    - npm run copy:deps
    - npm run rebuild:linux
    - npx --yes electron-builder --linux --publish=never
  artifacts:
    paths:
      - dist/SafeWheel-*.AppImage
    expire_in: 1 week
  only:
    - master
    - main
    - develop
    - tags

# Сборка для Windows
build:windows:
  stage: build
  image: node:18
  before_script:
    - apt-get update && apt-get install -y zip
  script:
    - npm install
    - cd frontend && npm install && cd ..
    - npm run build:frontend
    - npm run copy:deps
    - npm run rebuild:win
    - npx --yes electron-builder --win --config.win.target=dir --publish=never
    - cd dist/win-unpacked && zip -r ../../SafeWheel-Windows.zip . && cd ../..
  artifacts:
    paths:
      - SafeWheel-Windows.zip
    expire_in: 1 week
  only:
    - master
    - main
    - develop
    - tags

# Создание релиза
create:release:
  stage: release
  image: alpine:latest
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        # Создаем релиз для тега
        curl -X POST \
          -H "PRIVATE-TOKEN: $GITLAB_TOKEN" \
          -H "Content-Type: application/json" \
          -d "{
            \"name\": \"SafeWheel $CI_COMMIT_TAG\",
            \"tag_name\": \"$CI_COMMIT_TAG\",
            \"description\": \"Автоматический релиз SafeWheel $CI_COMMIT_TAG\",
            \"assets\": {
              \"links\": [
                {
                  \"name\": \"Linux AppImage\",
                  \"url\": \"$CI_JOB_URL/artifacts/file/dist/SafeWheel-*.AppImage\"
                },
                {
                  \"name\": \"Windows ZIP\",
                  \"url\": \"$CI_JOB_URL/artifacts/file/SafeWheel-Windows.zip\"
                }
              ]
            }
          }" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"
      fi
  dependencies:
    - build:linux
    - build:windows
  only:
    - tags
