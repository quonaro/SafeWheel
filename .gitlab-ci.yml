stages:
  - build
  - release

variables:
  NODE_VERSION: "20"
  ELECTRON_CACHE: "$CI_PROJECT_DIR/.cache/electron"
  ELECTRON_BUILDER_CACHE: "$CI_PROJECT_DIR/.cache/electron-builder"

# Кэширование для ускорения сборки
cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - node_modules/
    - frontend/node_modules/
    - .cache/

# Установка зависимостей и сборка фронтенда
install_and_build:
  stage: build
  image: node:${NODE_VERSION}
  script:
    - echo "🔍 Проверяем версии..."
    - node --version
    - npm --version
    - echo "🔧 Устанавливаем зависимости корневого проекта..."
    - npm install
    - echo "🔧 Устанавливаем зависимости фронтенда..."
    - cd frontend && npm ci && cd ..
    - echo "🔨 Собираем фронтенд..."
    - cd frontend && npm run build && cd ..
    - echo "✅ Фронтенд собран успешно"
    - ls -la frontend/dist/
  artifacts:
    paths:
      - node_modules/
      - frontend/node_modules/
      - frontend/dist/
    expire_in: 1 hour

# Сборка для Linux (AppImage)
build_linux:
  stage: build
  image: node:${NODE_VERSION}
  dependencies:
    - install_and_build
  before_script:
    - apt-get update && apt-get install -y libnss3-dev libatk-bridge2.0-dev libdrm2 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libxss1 libasound2
  script:
    - echo "🔍 Проверяем версии..."
    - node --version
    - npm --version
    - echo "🔧 Устанавливаем зависимости корневого проекта..."
    - npm install
    - echo "🔧 Устанавливаем зависимости фронтенда..."
    - cd frontend && npm ci && cd ..
    - echo "🔨 Собираем фронтенд..."
    - cd frontend && npm run build && cd ..
    - echo "🔍 Проверяем, что фронтенд собран..."
    - ls -la frontend/dist/
    - echo "🔨 Собираем Electron приложение для Linux..."
    - npm run build:electron -- --linux AppImage
  artifacts:
    paths:
      - dist/*.AppImage
    expire_in: 1 week
  only:
    - tags
    - /^v.*$/

# Сборка для Windows (EXE)
build_windows:
  stage: build
  image: node:${NODE_VERSION}
  dependencies:
    - install_and_build
  before_script:
    - apt-get update && apt-get install -y wine xvfb
    - export DISPLAY=:99
    - Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
  script:
    - echo "🔍 Проверяем версии..."
    - node --version
    - npm --version
    - echo "🔧 Устанавливаем зависимости корневого проекта..."
    - npm install
    - echo "🔧 Устанавливаем зависимости фронтенда..."
    - cd frontend && npm ci && cd ..
    - echo "🔨 Собираем фронтенд..."
    - cd frontend && npm run build && cd ..
    - echo "🔍 Проверяем, что фронтенд собран..."
    - ls -la frontend/dist/
    - echo "🔍 Проверяем структуру проекта..."
    - ls -la
    - echo "🔍 Проверяем build директорию..."
    - ls -la build/
    - echo "🔨 Собираем Electron приложение для Windows..."
    - npm run build:electron -- --win nsis --x64
    - echo "🔍 Проверяем результат сборки..."
    - ls -la dist/
  artifacts:
    paths:
      - dist/*.exe
    expire_in: 1 week
  only:
    - tags
    - /^v.*$/

# Создание релиза
create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  dependencies:
    - build_linux
    - build_windows
  script:
    - echo "Creating release for tag $CI_COMMIT_TAG"
  release:
    name: "Release $CI_COMMIT_TAG"
    description: "SafeWheel Desktop Application Release $CI_COMMIT_TAG"
    tag_name: "$CI_COMMIT_TAG"
    ref: "$CI_COMMIT_SHA"
    assets:
      links:
        - name: "SafeWheel Linux AppImage"
          url: "${CI_JOB_URL}/artifacts/file/dist/SafeWheel-${CI_COMMIT_TAG#v}.AppImage"
        - name: "SafeWheel Windows Installer"
          url: "${CI_JOB_URL}/artifacts/file/dist/SafeWheel Setup ${CI_COMMIT_TAG#v}.exe"
  only:
    - tags
    - /^v.*$/
