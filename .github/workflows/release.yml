name: Create Release

on:
  push:
    tags:
      - "v*"

jobs:
  create-release:
    runs-on: ubuntu-latest
    name: Build and Release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: |
          npm install
          cd frontend && npm install && cd ..

      - name: Build frontend
        run: npm run build:frontend

      - name: Clean build directory
        run: |
          rm -rf build-deps dist/
          find node_modules -name ".package-lock.json" -delete 2>/dev/null || true
          find node_modules -name "package-lock.json" -delete 2>/dev/null || true
          find node_modules -name "*.log" -delete 2>/dev/null || true
          find node_modules -name "*.tmp" -delete 2>/dev/null || true

      - name: Copy dependencies
        run: npm run copy:deps

      - name: Rebuild native modules for Linux
        run: npm run rebuild:linux

      - name: Build Linux AppImage
        run: npx --yes electron-builder --linux --publish=never

      - name: Rebuild native modules for Windows
        run: npm run rebuild:win

      - name: Build Windows unpacked
        run: npx --yes electron-builder --win --config.win.target=dir --publish=never

      - name: Create Windows ZIP
        run: |
          cd dist/win-unpacked
          zip -r ../../SafeWheel-Windows.zip .
          cd ../..

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/SafeWheel-*.AppImage
            SafeWheel-Windows.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
