name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    name: Build Linux AppImage

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: |
          npm install
          cd frontend && npm install && cd ..

      - name: Build Linux AppImage
        run: npm run build:linux

      - name: Upload Linux AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/SafeWheel-*.AppImage
          retention-days: 30

  build-windows:
    runs-on: ubuntu-latest
    name: Build Windows

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: |
          npm install
          cd frontend && npm install && cd ..

      - name: Build Windows unpacked
        run: npm run build:win

      - name: Create Windows ZIP
        run: |
          cd dist/win-unpacked
          zip -r ../../SafeWheel-Windows.zip .
          cd ../..

      - name: Upload Windows ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: SafeWheel-Windows.zip
          retention-days: 30

  create-release:
    runs-on: ubuntu-latest
    name: Create Release
    needs: [build-linux, build-windows]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Linux AppImage artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: artifacts/linux/

      - name: Download Windows ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: artifacts/windows/

      - name: List downloaded artifacts
        run: |
          echo "=== Linux artifacts ==="
          ls -la artifacts/linux/ || echo "No Linux artifacts found"
          echo "=== Windows artifacts ==="
          ls -la artifacts/windows/ || echo "No Windows artifacts found"

      - name: Prepare release files
        run: |
          mkdir -p release-files

          # Copy Linux AppImage
          if [ -d "artifacts/linux" ]; then
            cp artifacts/linux/*.AppImage release-files/ 2>/dev/null || echo "No AppImage found"
          fi

          # Copy Windows ZIP
          if [ -d "artifacts/windows" ]; then
            cp artifacts/windows/*.zip release-files/ 2>/dev/null || echo "No Windows ZIP found"
          fi

          echo "=== Release files ==="
          ls -la release-files/

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: release-files/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup artifacts
        if: always()
        run: |
          rm -rf artifacts/ release-files/
