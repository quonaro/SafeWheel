name: Build & Release

on:
  push:
    tags:
    - 'v*.*.*'
  workflow_dispatch:


permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Install Linux dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev build-essential pkg-config

    - name: Cache Wails CLI
      uses: actions/cache@v4
      with:
        path: ~/go/bin/wails
        key: wails-cli-${{ runner.os }}-v2.15.0

    - name: Install Wails CLI
      run: command -v wails >/dev/null 2>&1 || go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

    - name: Build
      run: wails build -tags webkit2_41 -ldflags "-s -w" -trimpath -platform linux/amd64 -o safe-wheel-linux-amd64

    - name: Debug git status
      run: |
        git describe --tags --dirty
        git status --porcelain
        git diff --stat

    - uses: actions/upload-artifact@v4
      with:
        name: safe-wheel-linux-amd64
        path: build/bin/safe-wheel-linux-amd64

  build-windows:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Install NSIS
      run: sudo apt-get update && sudo apt-get install -y nsis

    - name: Cache Wails CLI
      uses: actions/cache@v4
      with:
        path: ~/go/bin/wails
        key: wails-cli-${{ runner.os }}-v2.15.0

    - name: Install Wails CLI
      run: command -v wails >/dev/null 2>&1 || go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

    - name: Build
      run: wails build -tags webkit2_41 -ldflags "-s -w" -trimpath -platform windows/amd64 -nsis -o safe-wheel-windows-amd64.exe

    - name: Debug git status
      run: |
        git describe --tags --dirty
        git status --porcelain
        git diff --stat

    - uses: actions/upload-artifact@v4
      with:
        name: safe-wheel-windows-amd64
        path: |
          build/bin/safe-wheel-windows-amd64.exe
          build/bin/*-installer.exe

  release:
    needs: [ build-linux, build-windows ]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: |
          artifacts/safe-wheel-linux-amd64/safe-wheel-linux-amd64
          artifacts/safe-wheel-windows-amd64/safe-wheel-windows-amd64.exe
          artifacts/safe-wheel-windows-amd64/*-installer.exe
