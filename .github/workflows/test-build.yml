name: Test Build

on:
  workflow_dispatch: # Позволяет запускать вручную
  push:
    branches: [develop, dev, test]

jobs:
  test-build:
    runs-on: ubuntu-latest
    name: Test Linux Build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: |
          npm install
          cd frontend && npm install && cd ..

      - name: Build frontend
        run: npm run build:frontend

      - name: Clean build directory
        run: |
          rm -rf build-deps dist/
          find node_modules -name ".package-lock.json" -delete 2>/dev/null || true
          find node_modules -name "package-lock.json" -delete 2>/dev/null || true
          find node_modules -name "*.log" -delete 2>/dev/null || true
          find node_modules -name "*.tmp" -delete 2>/dev/null || true

      - name: Copy dependencies
        run: npm run copy:deps

      - name: Rebuild native modules for Linux
        run: npm run rebuild:linux

      - name: Test build (without creating artifacts)
        run: |
          echo "Testing build process..."
          npx --yes electron-builder --linux --publish=never --dir
          echo "Build test completed successfully!"

      - name: Check build output
        run: |
          echo "Build output contents:"
          ls -la dist/
          if [ -d "dist/linux-unpacked" ]; then
            echo "Linux unpacked build found!"
            ls -la dist/linux-unpacked/
          else
            echo "No linux-unpacked directory found"
          fi
