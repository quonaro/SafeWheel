name: Build SafeWheel

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  release:
    types: [published]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    name: Build Linux AppImage

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: |
          npm install
          cd frontend && npm install && cd ..

      - name: Build frontend
        run: npm run build:frontend

      - name: Clean build directory
        run: rm -rf build-deps dist/

      - name: Copy dependencies
        run: npm run copy:deps

      - name: Rebuild native modules for Linux
        run: npm run rebuild:linux

      - name: Build AppImage
        run: npx --yes electron-builder --linux --publish=never

      - name: Upload Linux build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SafeWheel-Linux-AppImage
          path: dist/SafeWheel-*.AppImage
          retention-days: 30

  build-windows:
    runs-on: windows-latest
    name: Build Windows Unpacked

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: |
          npm install
          cd frontend && npm install && cd ..

      - name: Build frontend
        run: npm run build:frontend

      - name: Clean build directory
        run: rm -rf build-deps dist/

      - name: Copy dependencies
        run: npm run copy:deps

      - name: Rebuild native modules for Windows
        run: npm run rebuild:win

      - name: Build Windows unpacked
        run: npx --yes electron-builder --win --config.win.target=dir --publish=never

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SafeWheel-Windows-Unpacked
          path: dist/win-unpacked/
          retention-days: 30

  create-release:
    if: github.event_name == 'release'
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    name: Create Release Assets

    steps:
      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: SafeWheel-Linux-AppImage
          path: ./artifacts/linux/

      - name: Download Windows Unpacked
        uses: actions/download-artifact@v4
        with:
          name: SafeWheel-Windows-Unpacked
          path: ./artifacts/windows/

      - name: Create Windows ZIP
        run: |
          cd artifacts/windows
          zip -r ../../SafeWheel-Windows.zip .
          cd ../..

      - name: Upload Linux AppImage
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./artifacts/linux/SafeWheel-*.AppImage
          asset_name: SafeWheel-Linux.AppImage
          asset_content_type: application/octet-stream

      - name: Upload Windows ZIP
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./SafeWheel-Windows.zip
          asset_name: SafeWheel-Windows.zip
          asset_content_type: application/zip
