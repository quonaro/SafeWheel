name: Quick Build SafeWheel

on:
  workflow_dispatch: # Позволяет запускать вручную
  push:
    branches: [develop, dev]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            platform: linux
            target: AppImage
          - os: windows-latest
            platform: win
            target: dir

    name: Build for ${{ matrix.platform }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: |
          npm install
          cd frontend && npm install && cd ..

      - name: Build frontend
        run: npm run build:frontend

      - name: Clean build directory
        run: rm -rf build-deps dist/

      - name: Copy dependencies
        run: npm run copy:deps

      - name: Rebuild native modules
        run: |
          if [ "${{ matrix.platform }}" = "linux" ]; then
            npm run rebuild:linux
          else
            npm run rebuild:win
          fi

      - name: Build application
        run: |
          if [ "${{ matrix.platform }}" = "linux" ]; then
            npx --yes electron-builder --linux --publish=never
          else
            npx --yes electron-builder --win --config.win.target=dir --publish=never
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SafeWheel-${{ matrix.platform }}
          path: |
            dist/*.AppImage
            dist/win-unpacked/
          retention-days: 7
