default_install_hook_types: [ pre-commit ]
default_stages: [ pre-commit ]

repos:
- repo: local
  hooks:
  - id: go-fmt
    name: go fmt
    entry: go fmt ./...
    language: system
    types: [ go ]
    pass_filenames: false
    require_serial: true

  - id: golangci-lint
    name: golangci-lint
    entry: golangci-lint run ./...
    language: system
    types: [ go ]
    pass_filenames: false
    require_serial: true

  - id: prettier
    name: prettier
    entry: frontend/node_modules/.bin/prettier
    args:
    - --config
    - frontend/.prettierrc
    - --ignore-path
    - frontend/.prettierignore
    - --ignore-unknown
    - --write
    language: system
    files: '^frontend/'
    types: [ text ]
    pass_filenames: true

  - id: vue-tsc
    name: vue-tsc
    entry: bash
    args: [ '-c', 'cd frontend && ./node_modules/.bin/vue-tsc --noEmit' ]
    language: system
    files: '^frontend/.*\.(vue|[jt]sx?)$'
    pass_filenames: false
    require_serial: true
